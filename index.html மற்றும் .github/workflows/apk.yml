name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare web files
        run: |
          mkdir -p app/www
          cp index.html app/www/index.html

      - name: Create Android project
        working-directory: app
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/share@6
          npx cap init "கோழி பண்ணை" com.kozhi.pannai --web-dir=www
          npx cap add android
          npx cap sync android

      - name: Add automatic Downloads saver
        run: |
          D=app/android/app/src/main/java/com/kozhi/pannai
          mkdir -p "$D"
          cat > "$D/DownloadsWriter.java" <<'JAVA'
          package com.kozhi.pannai;

          import android.content.ContentResolver;
          import android.content.ContentValues;
          import android.net.Uri;
          import android.os.Build;
          import android.provider.MediaStore;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.io.OutputStream;
          import java.nio.charset.StandardCharsets;

          @CapacitorPlugin(name = "DownloadsWriter")
          public class DownloadsWriter extends Plugin {
              @PluginMethod
              public void save(PluginCall call) {
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.Q) {
                      call.reject("Android 10 அல்லது அதற்கு மேல் தேவை");
                      return;
                  }
                  String name = call.getString("name", "kozhi_pannai_backup.json");
                  String data = call.getString("data", "");
                  ContentResolver resolver = getContext().getContentResolver();
                  try {
                      resolver.delete(MediaStore.Downloads.EXTERNAL_CONTENT_URI,
                          MediaStore.Downloads.DISPLAY_NAME + "=?", new String[]{name});
                      ContentValues v = new ContentValues();
                      v.put(MediaStore.Downloads.DISPLAY_NAME, name);
                      v.put(MediaStore.Downloads.MIME_TYPE, "application/json");
                      v.put(MediaStore.Downloads.IS_PENDING, 1);
                      Uri uri = resolver.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, v);
                      if (uri == null) {
                          call.reject("கோப்பு உருவாக்க முடியவில்லை");
                          return;
                      }
                      try (OutputStream os = resolver.openOutputStream(uri)) {
                          if (os == null) {
                              call.reject("கோப்பு திறக்க முடியவில்லை");
                              return;
                          }
                          os.write(data.getBytes(StandardCharsets.UTF_8));
                      }
                      ContentValues done = new ContentValues();
                      done.put(MediaStore.Downloads.IS_PENDING, 0);
                      resolver.update(uri, done, null, null);
                      call.resolve(new JSObject());
                  } catch (Exception e) {
                      call.reject(String.valueOf(e.getMessage()));
                  }
              }
          }
          JAVA
          cat > app/android/app/src/main/java/com/kozhi/pannai/MainActivity.java <<'JAVA'
          package com.kozhi.pannai;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(DownloadsWriter.class);
                  super.onCreate(savedInstanceState);
              }
          }
          JAVA

      - name: Build APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: kozhi-pannai-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
