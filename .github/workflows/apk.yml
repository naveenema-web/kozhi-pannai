name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare web files
        run: |
          mkdir -p app/www
          cp index.html app/www/index.html

      - name: Create Android project
        working-directory: app
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/share@6 @capacitor/browser@6
          npx cap init "கோழி பண்ணை" com.kozhi.pannai --web-dir=www
          npx cap add android
          npx cap sync android

      - name: Add automatic Downloads saver
        run: |
          D=app/android/app/src/main/java/com/kozhi/pannai
          mkdir -p "$D"
          cat > "$D/DownloadsWriter.java" <<'JAVA'
          package com.kozhi.pannai;

          import android.content.ContentResolver;
          import android.content.ContentValues;
          import android.net.Uri;
          import android.os.Build;
          import android.provider.MediaStore;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.io.OutputStream;
          import java.nio.charset.StandardCharsets;

          @CapacitorPlugin(name = "DownloadsWriter")
          public class DownloadsWriter extends Plugin {
              @PluginMethod
              public void save(PluginCall call) {
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.Q) {
                      call.reject("Android 10 அல்லது அதற்கு மேல் தேவை");
                      return;
                  }
                  String name = call.getString("name", "kozhi_pannai_backup.json");
                  String data = call.getString("data", "");
                  ContentResolver resolver = getContext().getContentResolver();
                  try {
                      resolver.delete(MediaStore.Downloads.EXTERNAL_CONTENT_URI,
                          MediaStore.Downloads.DISPLAY_NAME + "=?", new String[]{name});
                      ContentValues v = new ContentValues();
                      v.put(MediaStore.Downloads.DISPLAY_NAME, name);
                      v.put(MediaStore.Downloads.MIME_TYPE, "application/json");
                      v.put(MediaStore.Downloads.IS_PENDING, 1);
                      Uri uri = resolver.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, v);
                      if (uri == null) {
                          call.reject("கோப்பு உருவாக்க முடியவில்லை");
                          return;
                      }
                      try (OutputStream os = resolver.openOutputStream(uri)) {
                          if (os == null) {
                              call.reject("கோப்பு திறக்க முடியவில்லை");
                              return;
                          }
                          os.write(data.getBytes(StandardCharsets.UTF_8));
                      }
                      ContentValues done = new ContentValues();
                      done.put(MediaStore.Downloads.IS_PENDING, 0);
                      resolver.update(uri, done, null, null);
                      call.resolve(new JSObject());
                  } catch (Exception e) {
                      call.reject(String.valueOf(e.getMessage()));
                  }
              }
          }
          JAVA
          cat > app/android/app/src/main/java/com/kozhi/pannai/MainActivity.java <<'JAVA'
          package com.kozhi.pannai;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(DownloadsWriter.class);
                  super.onCreate(savedInstanceState);
              }
          }
          JAVA

      - name: Set app icon from the picture
        run: |
          RES=app/android/app/src/main/res
          SRC=$GITHUB_WORKSPACE/app-icon.png
          if [ ! -f "$SRC" ]; then echo "app-icon.png not found; keeping default icon"; exit 0; fi
          # legacy launcher icons (sharp Lanczos resize + light sharpening)
          for pair in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            d=${pair%%:*}; s=${pair##*:}
            mkdir -p "$RES/mipmap-$d"
            convert "$SRC" -filter Lanczos -resize ${s}x${s} -unsharp 0x0.75+0.75+0.008 "$RES/mipmap-$d/ic_launcher.png"
            cp "$RES/mipmap-$d/ic_launcher.png" "$RES/mipmap-$d/ic_launcher_round.png"
          done
          # adaptive foreground: 108dp canvas per density, picture fills the centre
          for pair in mdpi:108 hdpi:162 xhdpi:216 xxhdpi:324 xxxhdpi:432; do
            d=${pair%%:*}; s=${pair##*:}
            mkdir -p "$RES/mipmap-$d"
            convert "$SRC" -filter Lanczos -resize $((s*92/108))x$((s*92/108)) -unsharp 0x0.75+0.75+0.008 -gravity center -background none -extent ${s}x${s} "$RES/mipmap-$d/ic_launcher_foreground.png"
          done
          echo "App icon set"

      - name: Set launch screen picture
        run: |
          RES=app/android/app/src/main/res
          SRC=$GITHUB_WORKSPACE/app-icon.png
          [ -f "$SRC" ] || { echo "app-icon.png not found"; exit 0; }
          mkdir -p "$RES/drawable" "$RES/drawable-port" "$RES/drawable-land"
          for d in drawable drawable-port drawable-land; do
            convert -size 1080x1920 xc:'#0d2b1e' \( "$SRC" -resize 1000x1000 \) -gravity center -composite "$RES/$d/splash.png"
          done
          echo "Launch picture set"
          # blank (transparent) icon for the system opening screen, so no small icon shows; the big picture is the window background
          convert -size 288x288 xc:none "$RES/drawable/splash_blank.png"
          # Android 12+ opening screen: show only this picture on the dark background (no app icon)
          python3 - <<'PY'
          import re
          p = "app/android/app/src/main/res/values/styles.xml"
          s = open(p, encoding="utf-8").read()
          items = ('<item name="android:windowSplashScreenBackground">#0d2b1e</item>'
                   '<item name="android:windowSplashScreenAnimatedIcon">@drawable/splash_blank</item>'
                   '<item name="android:windowSplashScreenIconBackgroundColor">#0d2b1e</item>')
          s2 = re.sub(r'(<style name="AppTheme\.NoActionBarLaunch"[^>]*>)', lambda m: m.group(1) + items, s, count=1)
          open(p, "w", encoding="utf-8").write(s2)
          print("styles patched:", s2 != s)
          PY

      - name: Build APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: kozhi-pannai-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
