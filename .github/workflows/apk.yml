name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install image tools
        run: |
          # the build machine sometimes cannot reach the package server for a moment; retry a few times
          for i in 1 2 3 4; do
            if sudo apt-get update -y && sudo apt-get install -y --no-install-recommends imagemagick; then
              break
            fi
            echo "retry $i"
            sleep 30
          done
          if command -v convert >/dev/null 2>&1 || command -v magick >/dev/null 2>&1; then
            echo 'ImageMagick ready'
          else
            echo 'ImageMagick could not be installed'; exit 1
          fi

      - name: Prepare web files
        run: |
          mkdir -p app/www
          cp index.html app/www/index.html

      - name: Create Android project
        working-directory: app
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/share@6 @capacitor/browser@6
          npx cap init "கோழி பண்ணை" com.kozhi.pannai --web-dir=www
          npx cap add android
          npx cap sync android

      - name: Set up app icon, saver and opening screen
        run: bash scripts/setup-android.sh

      - name: Build APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: kozhi-pannai-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
